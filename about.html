<!DOCTYPE html>
<html lang="ar" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Yousef Hossam | من أنا — يوسف حسام</title>
  <meta name="description" content="Learn about Yousef Hossam — backend developer specializing in Node.js, Express, and scalable architectures. تعرف على يوسف حسام — مطور باك إند.">
  <meta name="keywords" content="Yousef Hossam, يوسف حسام, backend developer, about, من أنا, مطور باك إند, Egypt">
  <link rel="canonical" href="https://youssefhossam-dev.vercel.app/about.html">
  <meta property="og:title" content="About Yousef Hossam — Backend Developer">
  <meta property="og:description" content="Backend developer specializing in Node.js, Express, and scalable APIs.">
  <meta property="og:url" content="https://youssefhossam-dev.vercel.app/about.html">
  <meta property="og:type" content="website">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Yousef Hossam",
    "alternateName": "يوسف حسام",
    "jobTitle": "Backend Developer",
    "url": "https://youssefhossam-dev.vercel.app"
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style id="theme-vars"></style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo" id="logoLink">Yousef Hossam<span class="dot">.</span></a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/about.html" class="active">About</a>
        <a href="/projects.html">Projects</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">Menu</button>
    </div>
  </header>

  <main>
    <section class="section page-header">
      <div class="container fade-in-up">
        <h1>About Me</h1>
      </div>
    </section>

    <section class="section">
      <div class="container about-grid">
        <div class="about-text fade-in-left" id="aboutText">
          <p class="loading">Loading...</p>
        </div>
        <div class="skills-section fade-in-right" id="skillsSection">
          <h3>Skills</h3>
          <div id="skillsContent" class="stagger-children"><p class="loading">Loading...</p></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container fade-in-up">
        <h2 class="section-title">Experience</h2>
        <div class="timeline stagger-children" id="timeline">
          <p class="loading">Loading...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="https://github.com/YoussefHossam-Official" target="_blank" rel="noopener">GitHub</a>
        <a href="#" target="_blank" rel="noopener" id="footerLinkedin">LinkedIn</a>
        <a href="#" id="footerEmail">Email</a>
      </div>
      <p class="footer-copy" id="footerCopy">&copy; Yousef Hossam</p>
    </div>
  </footer>

  <button class="hidden-link" id="adminLink" title="Admin"></button>

  <script src="/js/main.js"></script>
  <script>
    fetch('/api/pages/about')
      .then(r => r.json())
      .then(d => {
        const s = d.site;
        document.getElementById('aboutText').innerHTML = `<p>${s.about || 'Loading...'}</p>`;
        applyTheme(s.colors);
        if (s.social?.linkedin) document.getElementById('footerLinkedin').href = s.social.linkedin;
        if (s.email) document.getElementById('footerEmail').href = 'mailto:' + s.email;
        document.getElementById('footerCopy').textContent = '© ' + new Date().getFullYear() + ' ' + s.name;
        const skills = d.skills;
        const container = document.getElementById('skillsContent');
        container.innerHTML = Object.entries(skills || {}).map(([cat, items]) =>
          `<div class="skill-cat"><h4>${cat.charAt(0).toUpperCase() + cat.slice(1)}</h4><div class="skill-tags">${(items || []).map(i => `<span class="skill-tag">${i}</span>`).join('')}</div></div>`
        ).join('');
        setTimeout(() => container.classList.add('visible'), 100);
        const timeline = document.getElementById('timeline');
        if (!d.experience?.length) { timeline.innerHTML = '<p class="empty">No experience added yet.</p>'; return; }
        timeline.innerHTML = d.experience.map(e => `
          <div class="timeline-item">
            <div class="timeline-date">${e.from || ''} — ${e.to || 'Present'}</div>
            <h3>${e.position}</h3>
            <h4>${e.company}</h4>
            ${e.description ? `<p>${Array.isArray(e.description) ? e.description.join('<br>') : e.description}</p>` : ''}
          </div>
        `).join('');
        setTimeout(() => timeline.classList.add('visible'), 150);
      });
  </script>
</body>
</html>
