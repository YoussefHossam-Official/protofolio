<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <style id="theme-vars"></style>
</head>
<body>
  <header class="admin-header">
    <div class="container">
      <h1>Manage Skills</h1>
      <nav class="admin-nav">
        <a href="/admin/index.html">Dashboard</a>
        <a href="/admin/site.html">Site</a>
        <a href="/admin/projects.html">Projects</a>
        <a href="/admin/experience.html">Experience</a>
        <a href="#" id="adminLogout">Logout</a>
      </nav>
    </div>
  </header>
  <main class="admin-main">
    <div class="container">
      <form id="skillsForm" class="admin-form">
        <div class="form-group"><label>Languages (comma separated)</label><input type="text" id="sk_languages"></div>
        <div class="form-group"><label>Frameworks (comma separated)</label><input type="text" id="sk_frameworks"></div>
        <div class="form-group"><label>Databases (comma separated)</label><input type="text" id="sk_databases"></div>
        <div class="form-group"><label>Tools (comma separated)</label><input type="text" id="sk_tools"></div>
        <div class="form-group"><label>Concepts (comma separated)</label><input type="text" id="sk_concepts"></div>
        <button type="submit" class="btn btn-primary">Save Skills</button>
        <p id="sk_msg" class="form-msg"></p>
      </form>
    </div>
  </main>
  <script src="/js/admin/skills.js"></script>
</body>
</html>
