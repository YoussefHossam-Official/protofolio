<!DOCTYPE html>
<html lang="ar" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yousef Hossam — Backend Developer | يوسف حسام — مطور باك إند</title>
  <meta name="description" content="Yousef Hossam — Backend developer specializing in Node.js, Express, and scalable APIs. يوسف حسام — مطور باك إند متخصص في Node.js و Express.">
  <meta name="keywords" content="Yousef Hossam, يوسف حسام, backend developer, مطور باك إند, Node.js, Express, portfolio, مصر, Egypt">
  <meta name="author" content="Yousef Hossam">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://youssefhossam-dev.vercel.app/">
  <meta property="og:title" content="Yousef Hossam — Backend Developer">
  <meta property="og:description" content="Backend developer specializing in Node.js, Express, and scalable APIs. مطور باك إند متخصص في بناء الـ APIs.">
  <meta property="og:url" content="https://youssefhossam-dev.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/avatar.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Yousef Hossam — Backend Developer">
  <meta name="twitter:description" content="Backend developer specializing in Node.js, Express, and scalable APIs.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Yousef Hossam",
    "alternateName": "يوسف حسام",
    "jobTitle": "Backend Developer",
    "url": "https://youssefhossam-dev.vercel.app",
    "sameAs": [
      "https://github.com/YoussefHossam-Official",
      "https://linkedin.com/in/youssef-hossam"
    ]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style id="theme-vars"></style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo" id="logoLink">Yousef Hossam<span class="dot">.</span></a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/about.html">About</a>
        <a href="/projects.html">Projects</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">Menu</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-content">
          <span class="badge" id="heroBadge">Backend Developer</span>
          <h1 id="heroName">Yousef Hossam</h1>
          <p class="hero-bio" id="heroBio">Loading...</p>
          <div class="hero-actions">
            <a href="/projects.html" class="btn btn-primary">View Projects</a>
            <a href="/contact.html" class="btn btn-outline">Contact Me</a>
          </div>
        </div>
        <div class="hero-image" id="heroImageContainer">
          <img id="heroImage" src="/images/avatar.jpg" alt="Yousef Hossam">
          <div class="hero-placeholder" id="heroPlaceholder" style="display:none">YH</div>
        </div>
      </div>
    </section>

    <section class="section featured-projects">
      <div class="container fade-in-up">
        <h2 class="section-title">Featured Projects</h2>
        <div class="projects-grid stagger-children" id="featuredProjects">
          <p class="loading">Loading projects...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="https://github.com/YoussefHossam-Official" target="_blank" rel="noopener">GitHub</a>
        <a href="#" target="_blank" rel="noopener" id="footerLinkedin">LinkedIn</a>
        <a href="#" id="footerEmail">Email</a>
      </div>
      <p class="footer-copy" id="footerCopy">&copy; Yousef Hossam</p>
    </div>
  </footer>

  <button class="hidden-link" id="adminLink" title="Admin"></button>

  <script src="/js/main.js"></script>
  <script>
    fetch('/api/pages')
      .then(r => r.json())
      .then(d => {
        const s = d.site;
        document.title = s.siteName + ' — ' + s.siteDesc;
        document.getElementById('heroName').textContent = s.name;
        document.getElementById('heroBadge').textContent = s.title;
        document.getElementById('heroBio').textContent = s.bio;
        const img = document.getElementById('heroImage');
        const ph = document.getElementById('heroPlaceholder');
        if (s.avatar) {
          img.src = s.avatar;
          img.style.display = 'block';
          ph.style.display = 'none';
        } else {
          img.style.display = 'none';
          ph.textContent = (s.name || 'YH').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase() || 'YH';
          ph.style.display = 'flex';
        }
        img.alt = s.name;
        if (s.social?.linkedin) document.getElementById('footerLinkedin').href = s.social.linkedin;
        if (s.email) document.getElementById('footerEmail').href = 'mailto:' + s.email;
        document.getElementById('footerCopy').textContent = '© ' + new Date().getFullYear() + ' ' + s.name;
        applyTheme(s.colors);
      });
    fetch('/api/projects')
      .then(r => r.json())
      .then(projects => {
        const container = document.getElementById('featuredProjects');
        if (!projects.length) {
          container.innerHTML = '<p class="empty">No projects yet.</p>';
          return;
        }
        container.innerHTML = projects.slice(0, 3).map(p => `
          <a href="/project.html?slug=${p.slug}" class="project-card">
            <h3>${p.title}</h3>
            <p>${p.shortDesc || p.description?.slice(0, 100)}</p>
            <div class="tech-stack">${(p.techStack || []).map(t => `<span class="tech-badge">${t}</span>`).join('')}</div>
          </a>
        `).join('');
        setTimeout(() => container.classList.add('visible'), 100);
      })
      .catch(() => document.getElementById('featuredProjects').innerHTML = '<p class="empty">Failed to load projects.</p>');
  </script>
</body>
</html>
