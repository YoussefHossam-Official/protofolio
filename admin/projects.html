<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <style id="theme-vars"></style>
</head>
<body>
  <header class="admin-header">
    <div class="container">
      <h1>Manage Projects</h1>
      <nav class="admin-nav">
        <a href="/admin/index.html">Dashboard</a>
        <a href="/admin/site.html">Site</a>
        <a href="/admin/skills.html">Skills</a>
        <a href="/admin/experience.html">Experience</a>
        <a href="#" id="adminLogout">Logout</a>
      </nav>
    </div>
  </header>
  <main class="admin-main">
    <div class="container">
      <button id="showAddForm" class="btn btn-primary" style="margin-bottom:20px">+ Add Project</button>
      <form id="projectForm" class="admin-form" style="display:none">
        <input type="hidden" id="p_id">
        <div class="form-group"><label>Title</label><input type="text" id="p_title" required></div>
        <div class="form-group"><label>Description</label><textarea id="p_desc" rows="4" required></textarea></div>
        <div class="form-group"><label>Short Description</label><textarea id="p_shortDesc" rows="2"></textarea></div>
        <div class="form-group"><label>Tech Stack (comma separated)</label><input type="text" id="p_tech" placeholder="Node.js, Express, MongoDB"></div>
        <div class="form-group"><label>GitHub URL</label><input type="url" id="p_github"></div>
        <div class="form-group"><label>Live Demo URL</label><input type="url" id="p_live"></div>
        <div class="form-group"><label>Image URL</label><input type="url" id="p_image"></div>
        <div class="form-group"><label>Features (one per line)</label><textarea id="p_features" rows="4"></textarea></div>
        <button type="submit" class="btn btn-primary" id="p_submit">Save</button>
        <button type="button" id="p_cancel" class="btn btn-outline">Cancel</button>
        <p id="p_msg" class="form-msg"></p>
      </form>
      <div id="projectsList" class="admin-list"></div>
    </div>
  </main>
  <script src="/js/admin/projects.js"></script>
</body>
</html>
