  <button class="hidden-link" id="adminLink" title="Admin"></button>

  <script src="/js/main.js"></script>
  <script>
    fetch('/api/pages')
      .then(r => r.json())
      .then(d => {
        const s = d.site;
        if (s) {
          applyTheme(s.colors);
          if (s.social?.linkedin) document.getElementById('footerLinkedin').href = s.social.linkedin;
          if (s.email) document.getElementById('footerEmail').href = 'mailto:' + s.email;
        if (s.phone) document.getElementById('footerPhone').textContent = s.phone;
        document.getElementById('footerCopy').textContent = '© ' + new Date().getFullYear() + ' ' + s.name;
      })
      .catch(() => {});
    fetch('/api/projects')
      .then(r => r.json())
      .then(projects => {
        const container = document.getElementById('projectsList');
        if (!projects.length) { container.innerHTML = '<p class="empty">No projects yet.</p>'; return; }
        container.innerHTML = projects.map(p => `
          <a href="/project.html?slug=${p.slug}" class="project-card">
            ${p.image ? `<img src="${p.image}" alt="${p.title}" class="project-img">` : ''}
            <h3>${p.title}</h3>
            <p>${p.shortDesc || p.description?.slice(0, 120) || ''}</p>
            <div class="tech-stack">${(p.techStack || []).map(t => `<span class="tech-badge">${t}</span>`).join('')}</div>
            <div class="project-links">
              ${p.github ? `<span class="link-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:3px"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>GitHub</span>` : ''}
              ${p.live ? `<span class="link-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Live</span>` : ''}
            </div>
          </a>
        `).join('');
        setTimeout(() => container.classList.add('visible'), 100);
      });
  </script>
